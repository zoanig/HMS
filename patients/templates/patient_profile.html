{% extends "core/base.html" %}
{% load static %}
{% block title %}{{ patient.name }}{% endblock %}

{% block content %}

<div class="shadow-sm rounded m-[15%]">
  <div class="flex flex-col lg:flex-row">
    <img
      src="{% static "profile.png" %}"
      class="max-w-sm"
    />
    <div class="flex flex-col justify-around">
        <div>
            <h1 class="text-3xl font-bold">{{patient.name}}</h1>
            <p>{{patient.gender}}</p>
            <p>{{patient.contact_number}}</p>
        </div>
        <div>
            <p><span class="font-bold">Born: </span>{{patient.date_of_birth}}</p>
            <p>{{patient.address}}</p>
            <a href="{% url "patients:edit_profile" %}" class="btn">Edit Profile</a>
        </div>
    </div>
  </div>
</div>

{% endblock %}
